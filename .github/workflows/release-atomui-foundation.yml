name: AtomUI.Foundation Release Pipeline

on:
  push:
    branches:
      - release/1.0
    paths:
      - .github/workflows/release-atomui-foundation.yml
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target branch to build'
        type: string
        default: 'release/1.0'
      build_configuration:
        description: 'Build configuration'
        type: string
        default: 'Release'
      publish_to_nuget:
        description: 'Publish to nuget.org'
        type: boolean
        default: false

env:
  SOURCE_DIR: ${{ github.workspace }}
  PACKAGE_OUTPUT_DIR: ${{ github.workspace }}/output
  BUILD_CONFIGURATION: ${{ github.event.inputs.build_configuration || 'Release' }}
  TARGET_BRANCH: ${{ github.event.inputs.target_branch || github.ref_name }}

jobs:
  BuildAtomUIFoundationNuget:
    name: Build AtomUI.Foundation NuGet packages
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build AtomUI.Foundation solution
        shell: pwsh
        run: |
          dotnet build --configuration $env:BUILD_CONFIGURATION ./AtomUI.Foundation.slnx

      - name: Test AtomUI.Foundation
        shell: pwsh
        run: |
          dotnet test ./tests/AtomUI.Foundation.Tests/AtomUI.Foundation.Tests.csproj --framework net10.0 --configuration $env:BUILD_CONFIGURATION --no-build

      - name: Test AtomUI.Foundation.Generator
        shell: pwsh
        run: |
          dotnet test ./tests/AtomUI.Foundation.Generator.Tests/AtomUI.Foundation.Generator.Tests.csproj --framework net10.0 --configuration $env:BUILD_CONFIGURATION --no-build

      - name: Create AtomUI.Foundation NuGet packages
        shell: pwsh
        run: |
          $projects = @(
            "./src/AtomUI.Foundation/AtomUI.Foundation.csproj",
            "./src/AtomUI.Foundation.Generator/AtomUI.Foundation.Generator.csproj"
          )
          foreach ($project in $projects) {
            dotnet pack --no-build --output $env:PACKAGE_OUTPUT_DIR --configuration $env:BUILD_CONFIGURATION $project
          }

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v6
        with:
          name: NuGetPackages
          path: ${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg

      - name: Publish to nuget.org
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_nuget == 'true' }}
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path $env:PACKAGE_OUTPUT_DIR -Filter *.nupkg -Recurse -File
          foreach ($pkg in $packages) {
            try {
              dotnet nuget push $pkg.FullName --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
              if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
              }
              Write-Output "Published NuGet package: $($pkg.Name)"
            }
            catch {
              Write-Error "Publish $($pkg.Name) error: $_"
              exit 1
            }
          }
